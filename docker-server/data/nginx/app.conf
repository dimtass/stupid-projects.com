# HTTP server to redirect to HTTPS
server {
    listen 80;
    server_name stupid-projects.com www.stupid-projects.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    server_name stupid-projects.com www.stupid-projects.com;

    ssl_certificate /etc/letsencrypt/live/www.stupid-projects.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.stupid-projects.com/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # HSTS (optional, but recommended)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Add this line outside of any location block
    index index.html;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
    }
}

