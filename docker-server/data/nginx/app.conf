server {
    listen 80;
    listen [::]:80;

    server_name stupid-projects.com www.stupid-projects.com;
    server_tokens off;

    location / {
        return 301 https://stupid-projects.com$request_uri;
    }
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
server {
    listen 443 default_server ssl http2;
    listen [::]:443 ssl http2;

    server_name stupid-projects.com;
    
    ssl_certificate /etc/letsencrypt/live/stupid-projects.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stupid-projects.com/privkey.pem;
    
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
    location / {
        proxy_pass http://stupid-projects.com; #for demo purposes
    }
}